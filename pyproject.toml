[project]
name = "issue-writer"
version = "0.1.0"
description = "Bilingual (EN/TR) synthetic dataset generator and fine-tuning pipeline for issue tracker entries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []          # the generator itself is stdlib only, on purpose

[project.optional-dependencies]
publish = ["huggingface_hub>=0.26", "datasets>=3.0"]
train   = ["transformers>=4.46", "trl>=0.12", "peft>=0.13",
           "bitsandbytes>=0.44", "accelerate>=1.0", "torch>=2.4"]
judge   = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "pydantic>=2.9"]

# Not: `ruff format` bilerek kullanilmiyor. generator/banks/ icindeki icerik
# havuzlari elle hizalanmis tuple'lardan olusuyor ve bu hizalama okunabilirligin
# bir parcasi; otomatik bicimlendirme onu bozuyor. Lint kurallari uygulanir.
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # satir uzunlugu: icerik havuzlarinda uzun Turkce/Ingilizce cumleler var
  "RUF001",  # belirsiz Unicode: Turkce metin bilincli olarak Unicode
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"generator/banks/*.py" = ["E402"]      # domain moduller import sirasina bagli
"scripts/tr_tools/*.py"  = ["SIM115", "E402", "E741"]  # tek seferlik bakim araclari

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["generator", "scripts", "."]
addopts = "-q --strict-markers"
markers = ["slow: veri seti uretimi gerektiren testler"]
